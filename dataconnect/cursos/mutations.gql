# ─────────────────────────────────────────────────────────────────────────────
#  Mutations del conector `cursos`.
# ─────────────────────────────────────────────────────────────────────────────

# Ejemplo resuelto: alta o actualización del perfil del alumno que llama.
# Observá que el cliente solo manda `nombre`:
#   - id_expr: "auth.uid"           → el servidor usa el UID del token
#   - email_expr: "auth.token.email" → el servidor usa el email del token
# Ningún usuario puede crear o modificar el perfil de otro.
mutation UpsertAlumno($nombre: String!) @auth(level: USER) {
  alumno_upsert(data: { id_expr: "auth.uid", nombre: $nombre, email_expr: "auth.token.email" })
}

# ─────────────────────────────────────────────────────────────────────────────
#  L2: Mutation `Inscribirme($cursoId: UUID!)`
#   - Solo para usuarios autenticados (USER).
#   - Inscribe AL USUARIO QUE LLAMA en el curso indicado.
#   - Idempotente: usa matricula_upsert con la clave compuesta (alumnoId, cursoId).
# ─────────────────────────────────────────────────────────────────────────────
mutation Inscribirme($cursoId: UUID!) @auth(level: USER) {
  matricula_upsert(data: { alumnoId_expr: "auth.uid", cursoId: $cursoId })
}


# ─────────────────────────────────────────────────────────────────────────────
#  L5 (opcional): Mutation `DarmeDeBaja($cursoId: UUID!)`
#   - Solo para usuarios autenticados (USER).
#   - Borra la inscripción del usuario que llama en ese curso, y solo esa.
#   - Usa la clave compuesta (alumnoId, cursoId) para identificar la fila.
# ─────────────────────────────────────────────────────────────────────────────
mutation DarmeDeBaja($cursoId: UUID!) @auth(level: USER) {
  matricula_delete(key: { alumnoId_expr: "auth.uid", cursoId: $cursoId })
}
