# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

on:
  pull_request:

# DONE A4: Bloque de concurrencia para cancelar builds anteriores en el mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar config Firebase (CI)
        run: cp lib/firebase-config.ts.template lib/firebase-config.ts

      - name: Typecheck
        run: npm run typecheck

      # DONE A2: Variables de entorno completadas con los datos del commit y PR
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      # DONE A3: Despliegue en Firebase con expiración controlada de 3 días
      - name: Deploy a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CI_CD_PROGRAMACION_AVANZADA }}
          projectId: ci-cd-programacion-avanzada
          expires: 3d
