# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

on:
  push:
    branches: [main]

# DONE A4: Concurrencia segura para producción (en cola, sin cancelar de forma abrupta)
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # DONE A5: Vinculación al entorno de producción para aprobación manual
    environment: production
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar config Firebase (CI)
        run: cp lib/firebase-config.ts.template lib/firebase-config.ts

      - name: Typecheck
        run: npm run typecheck

      # DONE A2: Variables corregidas específicamente para el evento 'push' en main
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CI_CD_PROGRAMACION_AVANZADA }}
          projectId: ci-cd-programacion-avanzada
          channelId: live
